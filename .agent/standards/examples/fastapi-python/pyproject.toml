[project]
name = "sc-fastapi-standards-example"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1"]

[project.optional-dependencies]
checks = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.4", "mypy==2.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
