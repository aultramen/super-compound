# Application integration starter; copying it does not activate protection.
# Install reviewed standards tools/configuration in the protected base first.
# Administrator: require the aggregate from an approved workflow source, native
# independent/CODEOWNER reviews, stale-review dismissal and an up-to-date branch;
# protect engine/config/workflow/ownership paths and restrict bypass separately.
# Review project runtimes and frozen installations before enabling this template.
# Configure every resultRef and observationRef under .scratch/standards/; manual
# observationRef values must be under .scratch/standards/reviews/. Keep secrets and raw logs elsewhere.
# Trusted jobs read API approvals without executing PR code. Never give those jobs
# dependency installation, untrusted hooks, or a PR checkout with credentials.
# This PR template does not certify post-merge releases or merge queues; qualify
# merge_group separately if the application uses a queue.
# Optional SOLO-OWNER/1.0.0: only a separately approved adoption.reviewAuthority
# already appointed on a current protected trusted base can accept owner COMMENTED
# self-review. See .agent/standards/solo-owner.md. It cannot satisfy native approving
# review counts/CODEOWNERS or independent G1/G2/G3 decisions. No mode is enabled here.
# Preserve all producer-success and fresh authenticated verification guards in either mode.
name: Application standards

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

# Replace these defaults with approved exact project runtime pins before adoption.
# A Python 3.14 application needs the same pinned runtime in prepare, checks and aggregate.
env:
  STANDARDS_NODE_VERSION: "24"
  STANDARDS_PYTHON_VERSION: "3.12"

concurrency:
  group: application-standards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  standards-prepare:
    runs-on: ubuntu-latest
    outputs:
      tested-sha: ${{ steps.identity.outputs.tested-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.STANDARDS_NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.STANDARDS_PYTHON_VERSION }}
      - name: Record actual tested revision
        id: identity
        run: echo "tested-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select all explicitly configured scopes
        run: node -e "const fs=require('node:fs');fs.mkdirSync('.scratch/standards/ci',{recursive:true});fs.writeFileSync('.scratch/standards/ci/paths.json',JSON.stringify(['.agent/rules/project-config.md']))"
      - name: Resolve pinned effective standards
        run: node .agent/tools/standards.mjs --paths-file .scratch/standards/ci/paths.json --output .scratch/standards/ci/snapshot.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standards-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/standards/ci/snapshot.json
          if-no-files-found: error
          include-hidden-files: true

  standards-review:
    needs: [standards-prepare]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.STANDARDS_NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standards-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/.scratch/standards/ci/
      - name: Retrieve authorized current native human reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STANDARDS_PR_NUMBER: ${{ github.event.pull_request.number }}
          STANDARDS_TESTED_SHA: ${{ needs.standards-prepare.outputs.tested-sha }}
          STANDARDS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STANDARDS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node trusted/.agent/tools/standards-github-review.mjs --root evidence --snapshot .scratch/standards/ci/snapshot.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standards-reviews-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/.scratch/standards/reviews/
          if-no-files-found: error
          include-hidden-files: true

  standards:
    needs: [standards-prepare, standards-review]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.standards-prepare.outputs.tested-sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.STANDARDS_NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.STANDARDS_PYTHON_VERSION }}
      # Add the same lockfile-based installation steps used in the aggregate here.
      # The standards runner uses the same configured check commands as local work.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standards-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/standards/ci/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standards-reviews-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/standards/reviews/
      - name: Execute applicable checks
        run: node .agent/tools/standards-checks.mjs --snapshot .scratch/standards/ci/snapshot.json --output .scratch/standards/ci/receipt.json
      - name: Preserve actual evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standards-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/standards/
          if-no-files-found: error
          include-hidden-files: true

  standards-review-fresh:
    if: ${{ always() }}
    needs: [standards-prepare, standards]
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.STANDARDS_NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standards-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/.scratch/standards/
      - name: Refetch and compare current native review evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STANDARDS_PR_NUMBER: ${{ github.event.pull_request.number }}
          STANDARDS_TESTED_SHA: ${{ needs.standards-prepare.outputs.tested-sha }}
          STANDARDS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STANDARDS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node trusted/.agent/tools/standards-github-review.mjs --verify --root evidence --snapshot .scratch/standards/ci/snapshot.json

  standards-aggregate:
    if: ${{ always() }}
    needs: [standards-prepare, standards-review, standards, standards-review-fresh]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.standards-prepare.outputs.tested-sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.STANDARDS_NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.STANDARDS_PYTHON_VERSION }}
      # Add the same lockfile-based installation steps used in standards here.
      # This fresh checkout must provide every pinned tool that verification probes.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: standards-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .scratch/standards/
      - name: Verify complete and current mandatory evidence
        if: ${{ always() }}
        run: node .agent/tools/standards-checks.mjs --verify --snapshot .scratch/standards/ci/snapshot.json --receipt .scratch/standards/ci/receipt.json
      - name: Require every producer and fresh review verification to succeed
        if: ${{ always() }}
        env:
          PREPARE_RESULT: ${{ needs.standards-prepare.result }}
          REVIEW_RESULT: ${{ needs.standards-review.result }}
          STANDARDS_JOB_RESULT: ${{ needs.standards.result }}
          FRESH_REVIEW_RESULT: ${{ needs.standards-review-fresh.result }}
        run: node -e "if(['PREPARE_RESULT','REVIEW_RESULT','STANDARDS_JOB_RESULT','FRESH_REVIEW_RESULT'].some(key=>process.env[key]!=='success'))process.exit(1)"
