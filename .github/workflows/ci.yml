name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic checks and unit suites
        run: npm test
      - name: Python suites
        run: npm run test:python
      - name: Framework audit
        run: npm run audit
      - name: Token benchmark
        run: npm run bench
